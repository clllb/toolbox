name: Sync AI Content & Process Files

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  sync-and-process:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      START_DATE: "2026-03-01"
      EXCLUDE_FILES: "_index.md about.md contact.md privacy-policy.md terms-of-service.md"

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone source repo
        run: |
          git clone --depth 1 --branch main https://github.com/justlovemaki/Hextra-AI-Insight-Daily.git source_repo

      - name: Prepare Directories
        run: |
          mkdir -p docs/AI/daily/cn
          mkdir -p docs/AI/weekly/cn

      # --- 1. 同步日报 (保持原有逻辑，精准匹配) ---
      - name: Sync CN Daily Reports
        run: |
          SRC_DIR="source_repo/content/cn"
          BASE_DEST="docs/AI/daily/cn"
          START_TS=$(date -d "$START_DATE" +%s)
          
          if [ ! -d "$SRC_DIR" ]; then echo "Source dir missing"; exit 1; fi

          find "$SRC_DIR" -maxdepth 2 -name "*.md" -type f | while read -r file; do
            filename=$(basename "$file")
            if echo "$EXCLUDE_FILES" | grep -qw "$filename"; then continue; fi
            
            if [[ $filename =~ ([0-9]{4}-[0-9]{2}-[0-9]{2})\.md$ ]]; then
              file_date="${BASH_REMATCH[1]}"
              file_ts=$(date -d "$file_date" +%s 2>/dev/null)
              if [ -z "$file_ts" ] || [ "$file_ts" -lt "$START_TS" ]; then continue; fi

              year_month=$(echo "$file_date" | cut -d '-' -f 1,2)
              dest_folder="$BASE_DEST/$year_month"
              mkdir -p "$dest_folder"
              cp "$file" "$dest_folder/"
              echo "✅ Copied Daily: $year_month/$filename"
            fi
          done

      # --- 2. 同步周报 (优化版：宽松匹配日期，同步所有周报) ---
      - name: Sync CN Weekly Reports
        run: |
          # 假设源仓库周报也在 content/cn/blog/weekly 下，如果路径不同请调整此处
          SRC_PATTERN="source_repo/content/cn/blog/weekly/*.md"
          DEST_DIR="docs/AI/weekly/cn"
          mkdir -p "$DEST_DIR"
          
          shopt -s nullglob
          files=($SRC_PATTERN)
          START_TS=$(date -d "$START_DATE" +%s)

          echo "🔍 Scanning weekly reports..."
          
          for file in "${files[@]}"; do
            filename=$(basename "$file")
            
            # 跳过排除文件
            if echo "$EXCLUDE_FILES" | grep -qw "$filename"; then 
              continue; 
            fi
            
            # 【优化】只要文件名中包含 YYYY-MM-DD 就尝试解析日期
            # 这样可以匹配：2026-03-01-xxx.md, xxx-2026-03-01.md, 2026-03-01.md
            if [[ $filename =~ ([0-9]{4}-[0-9]{2}-[0-9]{2}) ]]; then
              file_date="${BASH_REMATCH[1]}"
              file_ts=$(date -d "$file_date" +%s 2>/dev/null)
              
              if [ -z "$file_ts" ]; then 
                # 如果解析失败，为了安全起见，我们默认同步（或者您可以选择跳过）
                # 这里选择同步，防止因格式小问题漏掉文件
                echo "⚠️ Date parse weak match for: $filename (Syncing anyway)"
                cp "$file" "$DEST_DIR/"
                echo "✅ Copied Weekly (Weak Match): $filename"
                continue
              fi
              
              if [ "$file_ts" -lt "$START_TS" ]; then 
                echo "⏭️ Skipped (Old): $filename ($file_date)"
                continue; 
              fi

              cp "$file" "$DEST_DIR/"
              echo "✅ Copied Weekly: $filename (Date: $file_date)"
            else
              # 【关键策略】如果文件名里完全没日期，也同步！
              # 因为您说该目录下只有周报，防止文件名不规范导致漏同步
              echo "⚠️ No date found in filename, syncing anyway: $filename"
              cp "$file" "$DEST_DIR/"
              echo "✅ Copied Weekly (No Date): $filename"
            fi
          done

      # --- 3. 内容处理 ---
      - name: Process Content (Clean, Rename & Add H1)
        run: |
          echo "🚀 Starting content processing..."
          TARGET_DIRS=("docs/AI/daily/cn" "docs/AI/weekly/cn")
          processed_count=0
          
          for dir in "${TARGET_DIRS[@]}"; do
            if [ ! -d "$dir" ]; then continue; fi
            
            while IFS= read -r -d '' mdfile; do
              filename=$(basename "$mdfile")
              
              # 尝试提取日期 (宽松匹配)
              file_date=""
              if [[ $filename =~ ([0-9]{4}-[0-9]{2}-[0-9]{2}) ]]; then
                file_date="${BASH_REMATCH[1]}"
              fi
              
              # 如果没有提取到日期，使用当前日期或文件名作为 fallback，避免脚本出错
              display_date=${file_date:-"Unknown"}

              tmp_file=$(mktemp)
              
              # A: 删除单行广告
              sed '/^>  `AI资讯/d' "$mdfile" > "$tmp_file"
              mv "$tmp_file" "$mdfile"
              
              # B: 删除尾部推广块
              tmp_file2=$(mktemp)
              sed '/^## \*\*AI资讯日报多渠道\*\*/,$d' "$mdfile" > "$tmp_file2"
              mv "$tmp_file2" "$mdfile"
              
              # C: 插入 H1 标题
              h1_tag="<h1 align=\"center\">${display_date} AI资讯</h1>"
              
              if grep -q '## \*\*今日摘要\*\*' "$mdfile"; then
                sed -i "s|## \*\*今日摘要\*\*|${h1_tag}\n\n## **今日摘要**|" "$mdfile"
                echo "✅ Added H1 (Daily) to: $filename"
              elif grep -q '## \*\*本周摘要\*\*' "$mdfile"; then
                sed -i "s|## \*\*本周摘要\*\*|${h1_tag}\n\n## **本周摘要**|" "$mdfile"
                echo "✅ Added H1 (Weekly) to: $filename"
              else
                # 如果都没有，直接在文件最前面插入
                echo -e "${h1_tag}\n$(cat "$mdfile")" > "$tmp_file"
                mv "$tmp_file" "$mdfile"
                echo "✅ Added H1 (Top) to: $filename"
              fi
              
              # D: 全局替换名称
              if grep -q "何夕2077" "$mdfile"; then
                sed -i 's/何夕2077/陈老板/g' "$mdfile"
              fi
              
              processed_count=$((processed_count + 1))
            done < <(find "$dir" -name "*.md" -type f -print0)
          done
          echo "✅ Total processed files: $processed_count"

      # --- 4. 提交变更 ---
      - name: Commit and Push Changes
        run: |
          git add docs/
          if ! git diff --staged --quiet; then
            git commit -m "feat: sync daily & weekly content, process ads and titles"
            git push
            echo "✅ Pushed successfully."
          else
            echo "ℹ️ No changes detected."
          fi