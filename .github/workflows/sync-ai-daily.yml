name: Sync AI Daily & Weekly (CN Only + Fix Content + Rename)

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  sync-content:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      START_DATE: "2026-03-01"
      EXCLUDE_FILES: "_index.md about.md contact.md privacy-policy.md terms-of-service.md"

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone source repo
        run: |
          git clone --depth 1 --branch main https://github.com/justlovemaki/Hextra-AI-Insight-Daily.git source_repo

      - name: Prepare Directories
        run: |
          mkdir -p docs/AI/daily/cn
          mkdir -p docs/AI/weekly/cn

      # --- 1. 同步日报 (带月份归档) ---
      - name: Sync CN Daily Reports
        run: |
          SRC_DIR="source_repo/content/cn"
          BASE_DEST="docs/AI/daily/cn"
          START_TS=$(date -d "$START_DATE" +%s)
          
          if [ ! -d "$SRC_DIR" ]; then echo "Source dir missing"; exit 1; fi

          find "$SRC_DIR" -maxdepth 2 -name "*.md" -type f | while read -r file; do
            filename=$(basename "$file")
            if echo "$EXCLUDE_FILES" | grep -qw "$filename"; then continue; fi
            
            if [[ $filename =~ ([0-9]{4}-[0-9]{2}-[0-9]{2})\.md$ ]]; then
              file_date="${BASH_REMATCH[1]}"
              file_ts=$(date -d "$file_date" +%s 2>/dev/null)
              if [ -z "$file_ts" ] || [ "$file_ts" -lt "$START_TS" ]; then continue; fi

              year_month=$(echo "$file_date" | cut -d '-' -f 1,2)
              dest_folder="$BASE_DEST/$year_month"
              mkdir -p "$dest_folder"
              cp "$file" "$dest_folder/"
              echo "✅ Copied Daily: $year_month/$filename"
            fi
          done

      # --- 2. 同步周报 ---
      - name: Sync CN Weekly Reports
        run: |
          SRC_PATTERN="source_repo/content/cn/blog/weekly/*.md"
          DEST_DIR="docs/AI/weekly/cn"
          shopt -s nullglob
          files=($SRC_PATTERN)
          START_TS=$(date -d "$START_DATE" +%s)

          for file in "${files[@]}"; do
            filename=$(basename "$file")
            if echo "$EXCLUDE_FILES" | grep -qw "$filename"; then continue; fi
            
            # 简单日期检查
            if [[ $filename =~ ^([0-9]{4}-[0-9]{2}-[0-9]{2}) ]]; then
              file_date="${BASH_REMATCH[1]}"
              file_ts=$(date -d "$file_date" +%s 2>/dev/null)
              if [ -n "$file_ts" ] && [ "$file_ts" -lt "$START_TS" ]; then continue; fi
            fi

            cp "$file" "$DEST_DIR/"
            echo "✅ Copied Weekly: $filename"
          done

      # ================= 核心修改步骤 (修复版) =================
      - name: Process Content (Fix Delete & Rename)
        run: |
          echo "🚀 Starting content processing..."
          
          TARGET_DIRS=("docs/AI/daily/cn" "docs/AI/weekly/cn")
          processed_count=0
          renamed_count=0
          
          for dir in "${TARGET_DIRS[@]}"; do
            if [ ! -d "$dir" ]; then continue; fi
            
            find "$dir" -name "*.md" -type f | while read -r mdfile; do
              # 1. 备份当前状态用于调试（可选，出错时可查看）
              # cp "$mdfile" "$mdfile.bak" 
              
              tmp_file=$(mktemp)
              
              # --- 步骤 A: 仅删除特定的单行广告 ---
              # 逻辑：如果一行以 ">  `AI资讯" 开头，则删除该行 (d)
              # 这样不会误删后面的正文，因为正文不在这一行内
              sed '/^>  `AI资讯/d' "$mdfile" > "$tmp_file"
              mv "$tmp_file" "$mdfile"
              
              # --- 步骤 B: 删除尾部推广块 (如果存在) ---
              # 逻辑：如果存在 "## **AI资讯日报多渠道**"，删除该行及之后所有内容
              # 使用临时文件再次处理
              tmp_file2=$(mktemp)
              sed '/^## \*\*AI资讯日报多渠道\*\*/,$d' "$mdfile" > "$tmp_file2"
              mv "$tmp_file2" "$mdfile"
              
              # --- 步骤 C: 全局替换名称 (何夕2077 -> 陈老板) ---
              # 逻辑：直接替换字符串，不依赖行首行尾
              if grep -q "何夕2077" "$mdfile"; then
                sed -i 's/何夕2077/陈老板/g' "$mdfile"
                echo "✅ Renamed in: $mdfile"
              fi
              
              processed_count=$((processed_count + 1))
            done
          done
          
          echo "✅ Processed $processed_count files."
          echo "✅ Content cleaning and renaming completed."

      # --- 3. 提交变更 ---
      - name: Commit and Push Changes
        run: |
          git add docs/AI/
          if ! git diff --staged --quiet; then
            git commit -m "feat: sync CN content, fix ad removal, rename to 陈老板"
            git push
            echo "✅ Pushed successfully."
          else
            echo "ℹ️ No changes."
          fi