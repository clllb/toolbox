name: Sync AI Content, Add H1 & Update Sidebar

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  sync-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      START_DATE: "2026-03-01"
      EXCLUDE_FILES: "_index.md about.md contact.md privacy-policy.md terms-of-service.md"
      SIDEBAR_FILE: "docs/.vitepress/configs/sidebar.ts"

    steps:
      # --- 使用 v4 版本 ---
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # --- 使用 v4 版本 + Node 20 + 禁用缓存 ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: ''  # 关键：禁用包管理器缓存，防止 pnpm 报错

      - name: Clone source repo
        run: |
          git clone --depth 1 --branch main https://github.com/justlovemaki/Hextra-AI-Insight-Daily.git source_repo

      - name: Prepare Directories
        run: |
          mkdir -p docs/AI/daily/cn
          mkdir -p docs/AI/weekly/cn

      # --- 1. 同步日报 ---
      - name: Sync CN Daily Reports
        run: |
          SRC_DIR="source_repo/content/cn"
          BASE_DEST="docs/AI/daily/cn"
          START_TS=$(date -d "$START_DATE" +%s)
          
          if [ ! -d "$SRC_DIR" ]; then echo "Source dir missing"; exit 1; fi

          find "$SRC_DIR" -maxdepth 2 -name "*.md" -type f | while read -r file; do
            filename=$(basename "$file")
            if echo "$EXCLUDE_FILES" | grep -qw "$filename"; then continue; fi
            
            if [[ $filename =~ ([0-9]{4}-[0-9]{2}-[0-9]{2})\.md$ ]]; then
              file_date="${BASH_REMATCH[1]}"
              file_ts=$(date -d "$file_date" +%s 2>/dev/null)
              if [ -z "$file_ts" ] || [ "$file_ts" -lt "$START_TS" ]; then continue; fi

              year_month=$(echo "$file_date" | cut -d '-' -f 1,2)
              dest_folder="$BASE_DEST/$year_month"
              mkdir -p "$dest_folder"
              cp "$file" "$dest_folder/"
              echo "✅ Copied Daily: $year_month/$filename"
            fi
          done

      # --- 2. 同步周报 ---
      - name: Sync CN Weekly Reports
        run: |
          SRC_PATTERN="source_repo/content/cn/blog/weekly/*.md"
          DEST_DIR="docs/AI/weekly/cn"
          shopt -s nullglob
          files=($SRC_PATTERN)
          START_TS=$(date -d "$START_DATE" +%s)

          for file in "${files[@]}"; do
            filename=$(basename "$file")
            if echo "$EXCLUDE_FILES" | grep -qw "$filename"; then continue; fi
            
            if [[ $filename =~ ^([0-9]{4}-[0-9]{2}-[0-9]{2}) ]]; then
              file_date="${BASH_REMATCH[1]}"
              file_ts=$(date -d "$file_date" +%s 2>/dev/null)
              if [ -n "$file_ts" ] && [ "$file_ts" -lt "$START_TS" ]; then continue; fi
            fi

            cp "$file" "$DEST_DIR/"
            echo "✅ Copied Weekly: $filename"
          done

      # --- 3. 内容处理：清洗广告 + 替换名字 + 插入 H1 标题 ---
      - name: Process Content (Clean, Rename & Add H1)
        run: |
          echo "🚀 Starting content processing..."
          TARGET_DIRS=("docs/AI/daily/cn" "docs/AI/weekly/cn")
          processed_count=0
          
          for dir in "${TARGET_DIRS[@]}"; do
            if [ ! -d "$dir" ]; then continue; fi
            
            find "$dir" -name "*.md" -type f | while read -r mdfile; do
              filename=$(basename "$mdfile")
              
              # 提取日期
              if [[ $filename =~ ^([0-9]{4}-[0-9]{2}-[0-9]{2}) ]]; then
                file_date="${BASH_REMATCH[1]}"
                
                tmp_file=$(mktemp)
                
                # A: 删除单行广告
                sed '/^>  `AI资讯/d' "$mdfile" > "$tmp_file"
                mv "$tmp_file" "$mdfile"
                
                # B: 删除尾部推广块
                tmp_file2=$(mktemp)
                sed '/^## \*\*AI资讯日报多渠道\*\*/,$d' "$mdfile" > "$tmp_file2"
                mv "$tmp_file2" "$mdfile"
                
                # C: 插入 H1 标题
                h1_tag="<h1 align=\"center\">${file_date} AI资讯</h1>"
                
                if grep -q '## \*\*今日摘要\*\*' "$mdfile"; then
                  sed -i "s/## \*\*今日摘要\*\*/${h1_tag}\n\n## **今日摘要**/" "$mdfile"
                  echo "✅ Added H1 to: $filename"
                else
                  echo "⚠️ Skipped H1 (No '今日摘要' found): $filename"
                fi
                
                # D: 全局替换名称
                if grep -q "何夕2077" "$mdfile"; then
                  sed -i 's/何夕2077/陈老板/g' "$mdfile"
                fi
                
                processed_count=$((processed_count + 1))
              fi
            done
          done
          echo "✅ Processed $processed_count files."

      # --- 4. 自动更新侧边栏配置 ---
      - name: Update Sidebar Configuration
        run: |
          echo "🔄 Updating sidebar.ts..."
          
          cat > update_sidebar.js << 'EOF'
          const fs = require('fs');
          const path = require('path');

          const sidebarPath = process.env.SIDEBAR_FILE;
          const dailyDir = 'docs/AI/daily/cn';
          const weeklyDir = 'docs/AI/weekly/cn';

          function getFilesWithDate(dir) {
            if (!fs.existsSync(dir)) return [];
            const files = [];
            const walk = (currentDir) => {
              const entries = fs.readdirSync(currentDir, { withFileTypes: true });
              for (const entry of entries) {
                const fullPath = path.join(currentDir, entry.name);
                if (entry.isDirectory()) {
                  walk(fullPath);
                } else if (entry.isFile() && entry.name.endsWith('.md') && !entry.name.startsWith('_')) {
                  const match = entry.name.match(/(\d{4}-\d{2}-\d{2})\.md$/) || entry.name.match(/^(\d{4}-\d{2}-\d{2})/);
                  if (match) {
                    const dateStr = match[1];
                    let linkPath = fullPath.replace(/^docs/, '').split(path.sep).join('/');
                    files.push({ date: dateStr, link: linkPath, name: entry.name });
                  }
                }
              }
            };
            walk(dir);
            return files.sort((a, b) => new Date(b.date) - new Date(a.date));
          }

          let content = fs.readFileSync(sidebarPath, 'utf8');

          // 处理日报
          const dailyFiles = getFilesWithDate(dailyDir);
          const dailyItemsStr = dailyFiles.map(f => `        { text: '${f.date}', link: '${f.link}' }`).join(',\n');
          const dailyRegex = /(text:\s*['"]AI日报['"][\s\S]*?items:\s*\[)([\s\S]*?)(\]\s*,?\s*\n\s*\},?\s*\n\s*\{)/;
          if (dailyRegex.test(content)) {
            content = content.replace(dailyRegex, (match, start, oldItems, end) => start + '\n' + dailyItemsStr + '\n' + end);
            console.log('✅ Updated Daily Sidebar');
          }

          // 处理周报
          const weeklyFiles = getFilesWithDate(weeklyDir);
          const weeklyItemsStr = weeklyFiles.map(f => `        { text: '${f.date}周报', link: '${f.link}' }`).join(',\n');
          const weeklyRegex = /(text:\s*['"]AI周报['"][\s\S]*?items:\s*\[)([\s\S]*?)(\]\s*\n\s*\}\s*\]\s*\n\s*\}/);
          if (weeklyRegex.test(content)) {
            content = content.replace(weeklyRegex, (match, start, oldItems, end) => start + '\n' + weeklyItemsStr + '\n' + end);
            console.log('✅ Updated Weekly Sidebar');
          }

          fs.writeFileSync(sidebarPath, content);
          EOF

          node update_sidebar.js

      # --- 5. 提交变更 ---
      - name: Commit and Push Changes
        uses: actions/checkout@v4 # 这里其实不需要 checkout，直接用 run 即可，但为了保持一致性保留上面的逻辑，这里直接运行 git 命令
        run: |
          git add docs/
          if ! git diff --staged --quiet; then
            git commit -m "feat: sync content, add H1 title, clean ads, rename, update sidebar"
            git push
            echo "✅ Pushed successfully."
          else
            echo "ℹ️ No changes."
          fi