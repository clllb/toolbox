name: Sync AI Daily & Weekly (CN Only)

on:
  schedule:
    # 每天 UTC 时间 02:30 运行 (即北京时间 10:30)
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  sync-content:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      # ================= 配置区域 =================
      # 1. 只同步此日期之后的文件 (格式: YYYY-MM-DD)
      START_DATE: "2026-03-01" 
      
      # 2. 需要排除的文件名列表 (空格分隔)
      EXCLUDE_FILES: "_index.md about.md contact.md privacy-policy.md terms-of-service.md"
      # ===========================================

    steps:
      - name: Checkout target repo (toolbox)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone source repo
        run: |
          git clone --depth 1 --branch main https://github.com/justlovemaki/Hextra-AI-Insight-Daily.git source_repo

      - name: Prepare Base Directories
        run: |
          mkdir -p docs/AI/daily/cn
          mkdir -p docs/AI/weekly/cn

      # ================= 日报同步逻辑 (带月份归档) =================
      - name: Sync CN Daily Reports with Monthly Folders
        run: |
          echo "Starting CN Daily Sync..."
          SRC_DIR="source_repo/content/cn"
          BASE_DEST="docs/AI/daily/cn"
          
          # 将起始日期转换为秒数以便比较
          START_TS=$(date -d "$START_DATE" +%s)
          
          if [ ! -d "$SRC_DIR" ]; then
            echo "Error: Source directory $SRC_DIR not found."
            exit 1
          fi

          # 遍历 cn 目录下深度为 2 的所有 md 文件
          find "$SRC_DIR" -maxdepth 2 -name "*.md" -type f | while read -r file; do
            filename=$(basename "$file")
            
            # 1. 过滤排除的文件
            if echo "$EXCLUDE_FILES" | grep -qw "$filename"; then
              echo "⏭️  Skipping excluded file: $filename"
              continue
            fi

            # 2. 尝试从文件名提取日期 (假设格式为 YYYY-MM-DD.md)
            # 使用正则提取 YYYY-MM-DD 部分
            if [[ $filename =~ ([0-9]{4}-[0-9]{2}-[0-9]{2})\.md$ ]]; then
              file_date="${BASH_REMATCH[1]}"
              file_ts=$(date -d "$file_date" +%s 2>/dev/null)
              
              # 如果日期解析失败或早于起始日期，跳过
              if [ -z "$file_ts" ] || [ "$file_ts" -lt "$START_TS" ]; then
                echo "⏭️  Skipping old/invalid date file: $filename ($file_date)"
                continue
              fi

              # 3. 提取年月 (YYYY-MM) 用于创建子目录
              year_month=$(echo "$file_date" | cut -d '-' -f 1,2)
              dest_folder="$BASE_DEST/$year_month"
              
              # 创建月份目录
              mkdir -p "$dest_folder"
              
              # 复制文件
              cp "$file" "$dest_folder/"
              echo "✅ Copied: $year_month/$filename"
            else
              echo "⚠️  Skipping file with non-standard date format: $filename"
            fi
          done

      # ================= 周报同步逻辑 =================
      - name: Sync CN Weekly Reports
        run: |
          echo "Starting CN Weekly Sync..."
          SRC_PATTERN="source_repo/content/cn/blog/weekly/*.md"
          DEST_DIR="docs/AI/weekly/cn"
          
          shopt -s nullglob
          files=($SRC_PATTERN)
          
          if [ ${#files[@]} -eq 0 ]; then
            echo "No weekly files found."
            exit 0
          fi

          START_TS=$(date -d "$START_DATE" +%s)

          for file in "${files[@]}"; do
            filename=$(basename "$file")
            
            # 1. 过滤排除的文件
            if echo "$EXCLUDE_FILES" | grep -qw "$filename"; then
              echo "⏭️  Skipping excluded weekly file: $filename"
              continue
            fi

            # 2. 尝试从周报文件名提取日期 (通常周报文件名开头也是日期)
            # 假设格式：2026-03-08-xxxx.md
            if [[ $filename =~ ^([0-9]{4}-[0-9]{2}-[0-9]{2}) ]]; then
              file_date="${BASH_REMATCH[1]}"
              file_ts=$(date -d "$file_date" +%s 2>/dev/null)

              if [ -z "$file_ts" ] || [ "$file_ts" -lt "$START_TS" ]; then
                echo "⏭️  Skipping old weekly file: $filename ($file_date)"
                continue
              fi
            else
               # 如果周报文件名没有标准日期前缀，为了安全起见，可以选择跳过或全部保留
               # 这里选择保留，以防周报命名规则不同，但你也可以改为 continue 跳过
               echo "⚠️  Weekly file without standard date prefix, syncing anyway: $filename"
            fi

            cp "$file" "$DEST_DIR/"
            echo "✅ Copied Weekly: $filename"
          done

      # ================= 提交变更 =================
      - name: Commit and Push Changes
        run: |
          git add docs/AI/
          
          if ! git diff --staged --quiet; then
            git commit -m "feat: sync CN AI Daily (by month) & Weekly from upstream"
            git push
            echo "✅ Sync completed and pushed successfully."
          else
            echo "ℹ️ No new changes detected."
          fi