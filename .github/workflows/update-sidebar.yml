# .github/workflows/update-sidebar.yml
name: Update AI Sidebar Only

on:
  workflow_run:
    workflows: ["Sync AI Content & Process Files"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  update-sidebar:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SIDEBAR_FILE: "docs/.vitepress/configs/sidebar.ts"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Debug - List AI content files
        run: |
          echo "🔍 Daily files:"
          find docs/AI/daily/cn -name "*.md" | sort -r
          echo "🔍 Weekly files:"
          find docs/AI/weekly/cn -name "*.md" | sort -r

      - name: Generate and Update Sidebar
        run: |
          cat > update_sidebar.cjs << 'EOF'
          const fs = require('fs');
          const path = require('path');

          const sidebarPath = process.env.SIDEBAR_FILE;
          const dailyDir = 'docs/AI/daily/cn';
          const weeklyDir = 'docs/AI/weekly/cn';

          function extractDate(filename) {
            const match = filename.match(/(\d{4}-\d{2}-\d{2})/);
            return match ? match[1] : null;
          }

          function getFilesWithDate(dir) {
            if (!fs.existsSync(dir)) {
              console.warn(`⚠️ Directory not found: ${dir}`);
              return [];
            }
            const files = [];
            const walk = (currentDir) => {
              const entries = fs.readdirSync(currentDir, { withFileTypes: true });
              for (const entry of entries) {
                const fullPath = path.join(currentDir, entry.name);
                if (entry.isDirectory()) {
                  walk(fullPath);
                } else if (entry.isFile() && entry.name.endsWith('.md') && !entry.name.startsWith('_')) {
                  const dateStr = extractDate(entry.name);
                  let linkPath = fullPath.replace(/^docs/, '');
                  if (!linkPath.startsWith('/')) linkPath = '/' + linkPath;
                  files.push({ date: dateStr, originalName: entry.name, link: linkPath, sortKey: dateStr || entry.name });
                }
              }
            };
            walk(dir);
            return files.sort((a, b) => {
              if (a.date && b.date) return new Date(b.date) - new Date(a.date);
              else if (a.date) return -1;
              else if (b.date) return 1;
              else return b.originalName.localeCompare(a.originalName);
            });
          }

          // === Read sidebar file ===
          if (!fs.existsSync(sidebarPath)) {
            console.error(`❌ Sidebar file not found: ${sidebarPath}`);
            process.exit(1);
          }
          let content = fs.readFileSync(sidebarPath, 'utf8');

          // === Get files ===
          const dailyFiles = getFilesWithDate(dailyDir);
          const weeklyFiles = getFilesWithDate(weeklyDir);

          console.log("📊 Found", dailyFiles.length, "daily files");
          dailyFiles.forEach(f => console.log("  -", f.date, f.link));

          console.log("📊 Found", weeklyFiles.length, "weekly files");
          weeklyFiles.forEach(f => console.log("  -", f.date, f.link));

          // === Helper: Find section start by text content ===
          function findSectionStart(content, searchText) {
            const lines = content.split('\n');
            for (let i = 0; i < lines.length; i++) {
              if (lines[i].includes(searchText)) {
                // Look backward for the nearest '{'
                for (let j = i; j >= 0; j--) {
                  const openBraceIndex = lines[j].indexOf('{');
                  if (openBraceIndex !== -1) {
                    let globalIndex = 0;
                    for (let k = 0; k < j; k++) {
                      globalIndex += lines[k].length + 1; // +1 for \n
                    }
                    return globalIndex + openBraceIndex;
                  }
                }
              }
            }
            return -1;
          }

          // === Update AI日报 ===
          const dailySectionStart = findSectionStart(content, "text: 'AI日报'");
          if (dailySectionStart === -1) {
            console.error("❌ AI日报 section not found");
            process.exit(1);
          }

          const itemsStartStr = "items: [";
          const itemsStartIndex = content.indexOf(itemsStartStr, dailySectionStart);
          if (itemsStartIndex === -1) {
            console.error("❌ items: [ not found in AI日报 section");
            process.exit(1);
          }

          // Bracket matching to find closing ]
          let pos = itemsStartIndex + itemsStartStr.length;
          let depth = 1;
          while (pos < content.length && depth > 0) {
            if (content[pos] === '[') depth++;
            else if (content[pos] === ']') depth--;
            pos++;
          }
          if (depth !== 0) {
            console.error("❌ Unmatched brackets in daily items array");
            process.exit(1);
          }
          const itemsEndIndex = pos;

          const dailyItemsStr = dailyFiles.map(f =>
            `        { text: '${f.date}', link: '${f.link}' }`
          ).join(',\n');

          const beforeDaily = content.substring(0, itemsStartIndex + itemsStartStr.length + 1);
          const afterDaily = content.substring(itemsEndIndex - 1);
          content = beforeDaily + '\n' + dailyItemsStr + '\n      ' + afterDaily;
          console.log("✅ Updated AI日报 section");

          // === Update AI周报 ===
          const weeklySectionStart = findSectionStart(content, "text: 'AI周报'");
          if (weeklySectionStart === -1) {
            console.error("❌ AI周报 section not found");
            process.exit(1);
          }

          const weeklyItemsStartIndex = content.indexOf(itemsStartStr, weeklySectionStart);
          if (weeklyItemsStartIndex === -1) {
            console.error("❌ items: [ not found in AI周报 section");
            process.exit(1);
          }

          let weeklyPos = weeklyItemsStartIndex + itemsStartStr.length;
          let weeklyDepth = 1;
          while (weeklyPos < content.length && weeklyDepth > 0) {
            if (content[weeklyPos] === '[') weeklyDepth++;
            else if (content[weeklyPos] === ']') weeklyDepth--;
            weeklyPos++;
          }
          if (weeklyDepth !== 0) {
            console.error("❌ Unmatched brackets in weekly items array");
            process.exit(1);
          }
          const weeklyItemsEndIndex = weeklyPos;

          const weeklyItemsStr = weeklyFiles.map(f => {
            const text = f.date ? `${f.date} 周报` : f.originalName.replace('.md', '');
            return `        { text: '${text}', link: '${f.link}' }`;
          }).join(',\n');

          const beforeWeekly = content.substring(0, weeklyItemsStartIndex + itemsStartStr.length + 1);
          const afterWeekly = content.substring(weeklyItemsEndIndex - 1);
          content = beforeWeekly + '\n' + weeklyItemsStr + '\n      ' + afterWeekly;
          console.log("✅ Updated AI周报 section");

          fs.writeFileSync(sidebarPath, content);
          console.log("✅ Successfully updated sidebar.ts");
          EOF

          node update_sidebar.cjs

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit changes
        run: |
          git add "${{ env.SIDEBAR_FILE }}"
          git commit -m "🤖 Auto-update AI sidebar with latest reports"
          git push
