name: Update AI Sidebar Only

# 关键配置：监听主工作流的完成事件
on:
  workflow_run:
    workflows: ["Sync AI Content & Process Files"] # 必须与 sync-ai-daily.yml 中的 'name' 完全一致
    types:
      - completed
    branches:
      - main

jobs:
  update-sidebar:
    # 仅当主工作流成功执行时才运行
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      SIDEBAR_FILE: "docs/.vitepress/configs/sidebar.ts"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate and Update Sidebar
        run: |
          cat > update_sidebar.cjs << 'EOF'
          const fs = require('fs');
          const path = require('path');

          const sidebarPath = process.env.SIDEBAR_FILE;
          const dailyDir = 'docs/AI/daily/cn';
          const weeklyDir = 'docs/AI/weekly/cn';

          function getFilesWithDate(dir) {
            if (!fs.existsSync(dir)) return [];
            const files = [];
            const walk = (currentDir) => {
              const entries = fs.readdirSync(currentDir, { withFileTypes: true });
              for (const entry of entries) {
                const fullPath = path.join(currentDir, entry.name);
                if (entry.isDirectory()) {
                  walk(fullPath);
                } else if (entry.isFile() && entry.name.endsWith('.md') && !entry.name.startsWith('_')) {
                  const match = entry.name.match(/(\d{4}-\d{2}-\d{2})\.md$/) || entry.name.match(/^(\d{4}-\d{2}-\d{2})/);
                  if (match) {
                    const dateStr = match[1];
                    let linkPath = fullPath.replace(/^docs/, '').split(path.sep).join('/');
                    files.push({ date: dateStr, link: linkPath, name: entry.name });
                  }
                }
              }
            };
            walk(dir);
            return files.sort((a, b) => new Date(b.date) - new Date(a.date));
          }

          if (!fs.existsSync(sidebarPath)) {
            console.error(`❌ Sidebar file not found: ${sidebarPath}`);
            process.exit(1);
          }

          let content = fs.readFileSync(sidebarPath, 'utf8');

          // --- 处理日报部分 ---
          const dailyFiles = getFilesWithDate(dailyDir);
          const dailyItemsStr = dailyFiles.map(f => `        { text: '${f.date}', link: '${f.link}' }`).join(',\n');
          
          const dailyRegex = /(\/AI\/:\s*\[\s*\{\s*text:\s*['"]AI日报['"][\s\S]*?items:\s*\[)([\s\S]*?)(\]\s*\}\s*\])/;
          
          if (dailyRegex.test(content)) {
            content = content.replace(dailyRegex, (match, start, oldItems, end) => {
              return start + '\n' + dailyItemsStr + '\n      ' + end;
            });
            console.log('✅ Updated Daily Sidebar Section');
          } else {
            console.warn('⚠️ Daily Sidebar pattern not found.');
          }

          // --- 处理周报部分 ---
          const weeklyFiles = getFilesWithDate(weeklyDir);
          if (weeklyFiles.length > 0) {
             const weeklyItemsStr = weeklyFiles.map(f => `        { text: '${f.date}周报', link: '${f.link}' }`).join(',\n');
             const weeklyRegex = /(text:\s*['"]AI周报['"][\s\S]*?items:\s*\[)([\s\S]*?)(\]\s*\}\s*\])/;
             
             if (weeklyRegex.test(content)) {
               content = content.replace(weeklyRegex, (match, start, oldItems, end) => {
                 return start + '\n' + weeklyItemsStr + '\n      ' + end;
               });
               console.log('✅ Updated Weekly Sidebar Section');
             }
          }

          fs.writeFileSync(sidebarPath, content);
          EOF

          node update_sidebar.cjs

      - name: Commit and Push Sidebar Changes
        run: |
          git add $SIDEBAR_FILE
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update AI sidebar directory after sync"
            git push
            echo "✅ Sidebar updated and pushed."
          else
            echo "ℹ️ No sidebar changes needed."
          fi