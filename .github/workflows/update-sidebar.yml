# .github/workflows/update-sidebar.yml
name: Update AI Sidebar Only

on:
  workflow_run:
    workflows: ["Sync AI Content & Process Files"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  update-sidebar:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SIDEBAR_FILE: "docs/.vitepress/configs/sidebar.ts"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Debug - List AI content files
        run: |
          echo "🔍 Daily files:"
          find docs/AI/daily/cn -name "*.md" | sort -r
          echo "🔍 Weekly files:"
          find docs/AI/weekly/cn -name "*.md" | sort -r

      - name: Generate and Update Sidebar
        run: |
          cat > update_sidebar.cjs << 'EOF'
          const fs = require('fs');
          const path = require('path');

          const sidebarPath = process.env.SIDEBAR_FILE;
          const dailyDir = 'docs/AI/daily/cn';
          const weeklyDir = 'docs/AI/weekly/cn';
          const itemsStartStr = 'items: [';

          function extractDate(filename) {
            const match = filename.match(/(\d{4}-\d{2}-\d{2})/);
            return match ? match[1] : null;
          }

          function escapeValue(value) {
            return value.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
          }

          function getFilesWithDate(dir) {
            if (!fs.existsSync(dir)) {
              console.warn(`⚠️ Directory not found: ${dir}`);
              return [];
            }

            const files = [];

            function walk(currentDir) {
              const entries = fs.readdirSync(currentDir, { withFileTypes: true });
              for (const entry of entries) {
                const fullPath = path.join(currentDir, entry.name);
                if (entry.isDirectory()) {
                  walk(fullPath);
                  continue;
                }

                if (!entry.isFile() || !entry.name.endsWith('.md') || entry.name.startsWith('_') || entry.name === 'index.md') {
                  continue;
                }

                const date = extractDate(entry.name);
                if (!date) {
                  console.warn(`⚠️ Skipping file without date: ${fullPath}`);
                  continue;
                }

                let link = fullPath.replace(/^docs/, '');
                if (!link.startsWith('/')) {
                  link = `/${link}`;
                }

                files.push({
                  date,
                  month: date.slice(0, 7),
                  originalName: entry.name,
                  link
                });
              }
            }

            walk(dir);

            return files.sort((a, b) => {
              if (a.date !== b.date) {
                return b.date.localeCompare(a.date);
              }
              return b.originalName.localeCompare(a.originalName);
            });
          }

          function buildGroupedItems(files, labelBuilder) {
            const groups = new Map();

            for (const file of files) {
              if (!groups.has(file.month)) {
                groups.set(file.month, []);
              }
              groups.get(file.month).push(file);
            }

            const months = Array.from(groups.keys()).sort((a, b) => b.localeCompare(a));

            return months.map((month) => {
              const items = groups.get(month).map((file) => {
                const text = escapeValue(labelBuilder(file));
                const link = escapeValue(file.link);
                return `            { text: '${text}', link: '${link}' }`;
              }).join(',\n');

              return [
                '        {',
                `          text: '${escapeValue(month)}',`,
                '          collapsed: false,',
                '          items: [',
                items,
                '          ]',
                '        }'
              ].join('\n');
            }).join(',\n');
          }

          function findSectionStart(content, searchText) {
            const lines = content.split('\n');
            for (let i = 0; i < lines.length; i++) {
              if (!lines[i].includes(searchText)) {
                continue;
              }

              for (let j = i; j >= 0; j--) {
                const openBraceIndex = lines[j].indexOf('{');
                if (openBraceIndex === -1) {
                  continue;
                }

                let globalIndex = 0;
                for (let k = 0; k < j; k++) {
                  globalIndex += lines[k].length + 1;
                }
                return globalIndex + openBraceIndex;
              }
            }
            return -1;
          }

          function replaceSectionItems(content, sectionLabel, itemsContent) {
            const sectionStart = findSectionStart(content, `text: '${sectionLabel}'`);
            if (sectionStart === -1) {
              throw new Error(`${sectionLabel} section not found`);
            }

            const itemsStartIndex = content.indexOf(itemsStartStr, sectionStart);
            if (itemsStartIndex === -1) {
              throw new Error(`items: [ not found in ${sectionLabel} section`);
            }

            let pos = itemsStartIndex + itemsStartStr.length;
            let depth = 1;
            while (pos < content.length && depth > 0) {
              if (content[pos] === '[') depth++;
              if (content[pos] === ']') depth--;
              pos++;
            }

            if (depth !== 0) {
              throw new Error(`Unmatched brackets in ${sectionLabel} items array`);
            }

            const before = content.substring(0, itemsStartIndex + itemsStartStr.length + 1);
            const after = content.substring(pos - 1);
            return `${before}\n${itemsContent}\n      ${after}`;
          }

          if (!fs.existsSync(sidebarPath)) {
            console.error(`❌ Sidebar file not found: ${sidebarPath}`);
            process.exit(1);
          }

          let content = fs.readFileSync(sidebarPath, 'utf8');
          const dailyFiles = getFilesWithDate(dailyDir);
          const weeklyFiles = getFilesWithDate(weeklyDir);

          console.log(`📊 Found ${dailyFiles.length} daily files`);
          console.log(`📊 Found ${weeklyFiles.length} weekly files`);

          content = replaceSectionItems(
            content,
            'AI日报',
            buildGroupedItems(dailyFiles, (file) => file.date)
          );

          content = replaceSectionItems(
            content,
            'AI周报',
            buildGroupedItems(weeklyFiles, (file) => `${file.date} 周报`)
          );

          fs.writeFileSync(sidebarPath, content);
          console.log('✅ Successfully updated sidebar.ts');
          EOF

          node update_sidebar.cjs

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit changes
        run: |
          git add "${{ env.SIDEBAR_FILE }}"
          if ! git diff --staged --quiet; then
            git commit -m "🤖 Auto-update AI sidebar with latest reports"
            git push
          else
            echo "ℹ️ No sidebar changes detected."
          fi
