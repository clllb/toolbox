name: Update AI Sidebar Only

on:
  workflow_run:
    workflows: ["Sync AI Content & Process Files"]
    types:
      - completed
    branches:
      - main

jobs:
  update-sidebar:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      SIDEBAR_FILE: "docs/.vitepress/configs/sidebar.ts"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate and Update Sidebar
        run: |
          cat > update_sidebar.cjs << 'EOF'
          const fs = require('fs');
          const path = require('path');

          const sidebarPath = process.env.SIDEBAR_FILE;
          const dailyDir = 'docs/AI/daily/cn';
          const weeklyDir = 'docs/AI/weekly/cn';

          // 增强版：从任意位置提取日期，如果提取不到则返回空字符串
          function extractDate(filename) {
            const match = filename.match(/(\d{4}-\d{2}-\d{2})/);
            return match ? match[1] : null;
          }

          function getFilesWithDate(dir) {
            if (!fs.existsSync(dir)) return [];
            const files = [];
            const walk = (currentDir) => {
              const entries = fs.readdirSync(currentDir, { withFileTypes: true });
              for (const entry of entries) {
                const fullPath = path.join(currentDir, entry.name);
                if (entry.isDirectory()) {
                  walk(fullPath);
                } else if (entry.isFile() && entry.name.endsWith('.md') && !entry.name.startsWith('_')) {
                  const dateStr = extractDate(entry.name);
                  let linkPath = fullPath.replace(/^docs/, '').split(path.sep).join('/');
                  
                  files.push({ 
                    date: dateStr, 
                    originalName: entry.name,
                    link: linkPath, 
                    // 用于排序：如果有日期用日期，没有则用文件名（避免 undefined 导致排序错误）
                    sortKey: dateStr || entry.name 
                  });
                }
              }
            };
            walk(dir);
            
            // 排序逻辑：有日期的按日期倒序，没日期的排后面按文件名
            return files.sort((a, b) => {
              if (a.date && b.date) {
                return new Date(b.date) - new Date(a.date);
              } else if (a.date) {
                return -1; // a 有日期，排前面
              } else if (b.date) {
                return 1; // b 有日期，排前面
              } else {
                return b.originalName.localeCompare(a.originalName); // 都没日期，按文件名
              }
            });
          }

          if (!fs.existsSync(sidebarPath)) {
            console.error(`❌ Sidebar file not found: ${sidebarPath}`);
            process.exit(1);
          }

          let content = fs.readFileSync(sidebarPath, 'utf8');

          // --- 处理日报部分 ---
          const dailyFiles = getFilesWithDate(dailyDir);
          const dailyItemsStr = dailyFiles.map(f => `        { text: '${f.date || f.originalName}', link: '${f.link}' }`).join(',\n');
          
          const dailyRegex = /(\/AI\/:\s*\[\s*\{\s*text:\s*['"]AI日报['"][\s\S]*?items:\s*\[)([\s\S]*?)(\]\s*\}\s*\])/;
          
          if (dailyRegex.test(content)) {
            content = content.replace(dailyRegex, (match, start, oldItems, end) => {
              return start + '\n' + dailyItemsStr + '\n      ' + end;
            });
            console.log('✅ Updated Daily Sidebar Section');
          } else {
            console.warn('⚠️ Daily Sidebar pattern not found.');
          }

          // --- 处理周报部分 ---
          const weeklyFiles = getFilesWithDate(weeklyDir);
          if (weeklyFiles.length > 0) {
             // 显示文本：优先显示日期，如果没有日期则显示文件名（去掉.md）
             const weeklyItemsStr = weeklyFiles.map(f => {
               const text = f.date ? `${f.date} 周报` : f.originalName.replace('.md', '');
               return `        { text: '${text}', link: '${f.link}' }`;
             }).join(',\n');
             
             // 匹配 AI周报 部分
             const weeklyRegex = /(text:\s*['"]AI周报['"][\s\S]*?items:\s*\[)([\s\S]*?)(\]\s*\}\s*\])/;
             
             if (weeklyRegex.test(content)) {
               content = content.replace(weeklyRegex, (match, start, oldItems, end) => {
                 return start + '\n' + weeklyItemsStr + '\n      ' + end;
               });
               console.log(`✅ Updated Weekly Sidebar Section (${weeklyFiles.length} files)`);
             } else {
               console.warn('⚠️ Weekly Sidebar pattern not found. Make sure "AI周报" exists in sidebar.ts');
             }
          } else {
            console.log('ℹ️ No weekly files found to update.');
          }

          fs.writeFileSync(sidebarPath, content);
          EOF

          node update_sidebar.cjs

      - name: Commit and Push Sidebar Changes
        run: |
          git add $SIDEBAR_FILE
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update AI sidebar (daily & weekly)"
            git push
            echo "✅ Sidebar updated and pushed."
          else
            echo "ℹ️ No sidebar changes needed."
          fi