name: Build and Deploy to OSS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and Build
        run: |
          npm install
          npm run build
          ls -la dist 

      - name: Setup ossutil
        uses: manyuanrong/setup-ossutil@master
        with:
          endpoint: ${{ secrets.OSS_ENDPOINT }}
          access-key-id: ${{ secrets.OSS_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.OSS_ACCESS_KEY_SECRET }}

      - name: Sync dist to OSS
        run: |
          echo "Starting sync..."
          if [ ! "$(ls -A ./dist)" ]; then
            echo "❌ dist is empty!"
            exit 1
          fi
          ossutil sync ./dist/ oss://${{ secrets.OSS_BUCKET_NAME }}/ -f --delete
          echo "✅ Deployment completed!"
